[project]
name = "ravel-check"
version = "0.1.0"
description = "Ravel's input and output checks (sanitizer + guard) as a library: one call, no server, no model call."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ravel Contributors" }]
requires-python = ">=3.11"
dependencies = ["scikit-learn>=1.5,<2", "joblib>=1.4", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ravel"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["E501"]  # as the repository root config
